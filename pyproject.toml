[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finkernel"
version = "1.0.0"
description = "Financial Product Specification Language (PSL) & Execution Engine"
readme = "README.md"
requires-python = ">=3.10"
# Le compilateur PSL n'a besoin que de ces deux dépendances.
dependencies = [
    "pydantic>=2.9.2",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# Moteurs quantitatifs (Phase 3+). NB : le paquet PyPI s'appelle « QuantLib »;
# « QuantLib-Python » est abandonné à la 1.18.
quant = [
    "numpy>=2.1.1",
    "scipy>=1.14.1",
    "QuantLib>=1.34",
]
# Couche API (Phase 5)
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
]
dev = [
    "pytest>=8.3.3",
    "hypothesis>=6.112.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
